name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.2.0
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python plugins/review-desk/tests/test_review_desk.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: plugins/review-desk
      - run: node tests/test_panel.cjs
        working-directory: plugins/review-desk
      - run: python scripts/package_release.py
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$REVIEW_TAG" >/dev/null 2>&1; then
            gh release upload "$REVIEW_TAG" dist/* --clobber
          else
            gh release create "$REVIEW_TAG" dist/* --verify-tag --title "Review Desk $REVIEW_TAG" --notes-file CHANGELOG.md
          fi
